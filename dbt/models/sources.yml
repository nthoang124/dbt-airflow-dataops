version: 2

sources:
  - name: raw
    description: "AdventureWorks 2014 source database"
    database: AdventureWorks2014
    schema: Sales

    # Default freshness for all tables
    freshness:
      warn_after: {count: 4500, period: day}
      error_after: {count: 5000, period: day}
    loaded_at_field: ModifiedDate

    tables:
      - name: Customer
        description: "Customer master data"
        identifier: Customer
        columns:
          - name: CustomerID
            description: "Primary key"
            tests:
              - unique
              - not_null

          - name: ModifiedDate
            description: "Last modification timestamp"

      - name: SalesOrderHeader
        description: "Sales order header data"
        identifier: SalesOrderHeader
        columns:
          - name: SalesOrderID
            tests:
              - unique
              - not_null

          - name: CustomerID
            tests:
              - not_null
